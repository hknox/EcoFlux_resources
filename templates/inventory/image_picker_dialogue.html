<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 20px;
        background-color: #f8f9fa;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .image-item {
        cursor: pointer;
        border: 2px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        transition: all 0.3s;
        background: white;
      }

      .image-item:hover {
        border-color: #007bff;
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
      }

      .image-item img {
        width: 100%;
        height: 120px;
        object-fit: cover;
      }

      .image-item.selected {
        border-color: #007bff;
        background: #e7f3ff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
      }

      .tox-edit-area img {
          max-width: 100%;
          height: auto;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
      }

      .no-images {
        text-align: center;
        padding: 20px;
        color: #999;
        grid-column: 1 / -1;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <!-- <h5 class="mb-4">Select an Image</h5> -->

      <div id="imageGrid" class="image-grid"></div>

      <div class="d-flex gap-2 justify-content-end">
        <button id="selectBtn" class="btn btn-primary" disabled>
          Select Image
        </button>
        <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>

    <script>
      let selectedImage = null;

      // Get fieldnote_id from URL parameters
      const params = new URLSearchParams(window.location.search);
      const fieldnoteId = params.get("fieldnote_id");

      function loadImages() {
        const grid = document.getElementById("imageGrid");
        grid.innerHTML = '<div class="loading">Loading images...</div>';

        fetch(`{% url "tinymce_get_images" %}?fieldnote_id=${fieldnoteId}`)
          .then((response) => response.json())
          .then((images) => {
            grid.innerHTML = "";

            if (images.length === 0) {
              grid.innerHTML =
                '<div class="no-images">No images found for this site</div>';
              return;
            }

            images.forEach((image) => {
              const div = document.createElement("div");
              div.className = "image-item";
              div.innerHTML = `<img src="${image.value}" alt="${image.title}" title="${image.title}">`;
              div.onclick = () => selectImage(image.value, div);
              grid.appendChild(div);
            });
          })
          .catch((error) => {
            grid.innerHTML =
              '<div class="no-images">Error loading images</div>';
            console.error("Error:", error);
          });
      }

      function selectImage(url, element) {
        document
          .querySelectorAll(".image-item")
          .forEach((el) => el.classList.remove("selected"));
        element.classList.add("selected");
        selectedImage = url;
        document.getElementById("selectBtn").disabled = false;
      }

      document.getElementById("selectBtn").addEventListener("click", () => {
        if (selectedImage) {
          const marker = 'new-image-' + Date.now();
          parent.postMessage({
            mceAction: "imageSelected",
            imageUrl: selectedImage,
            width: 200,
          }, window.location.origin);
        }
      });

      document.getElementById("cancelBtn").addEventListener("click", () => {
        top.tinymce.activeEditor.windowManager.close();
      });

      loadImages();
    </script>
  </body>
</html>
